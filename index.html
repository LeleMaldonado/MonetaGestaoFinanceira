<script>
const T=['Caixa','Ações','FII','Renda fixa','Cripto','Exterior'],TC=['#8aa1a6','#0f5c63','#b8892b','#3d7ea6','#8a5fa8','#c0653a'];

const TABS=[['resumo','Resumo'],['inc','Entradas'],['exp','Despesas'],['inv','Investimentos'],['cal','Calendário']];
const KEY='meu-caixa-v1';
let S={inc:[],exp:[],inv:[],paid:{},goals:[10,30,20,30,5,5],pct:20};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(S.fix){S.fix.forEach(b=>S.exp.push({id:b.id,desc:b.name,d:new Date().toISOString().slice(0,7)+'-'+String(b.day).padStart(2,'0'),v:b.v,cat:'Moradia',pay:'Boleto',fx:1,cal:1}));delete S.fix}

const $=s=>document.querySelector(s);

const dim=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
const ml=m=>MN[+m.slice(5)-1]+'/'+m.slice(2,4);

const sv=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');

const PEN=ic('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),TR=ic('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),UP=ic('<path d="M12 19V5M6 11l6-6 6 6"/>'),DN=ic('<path d="M12 5v14M6 13l6 6 6-6"/>');
let tab='resumo',F={ys:[+cm.slice(0,4)],mo:[+cm.slice(5)]},F2=null,sd='desc',GE=0,gd=[],calM=cm;
const occM=(a,m)=>a.flatMap(x=>{if(!x.fx)return ym(x.d)==m?[x]:[];if(ym(x.d)>m)return [];return [{...x,d:m+'-'+pad(Math.min(+x.d.slice(8),dim(m)))}]});
function allMonths(){const a=[cm,...[...S.inc,...S.exp,...S.inv].map(x=>ym(x.d))].sort(),e=a[a.length-1],r=[];let y=+a[0].slice(0,4),m=+a[0].slice(5);for(;;){const k=y+'-'+pad(m);r.push(k);if(k>=e)break;if(++m>12){m=1;y++}}return r}
const lastN=()=>{const r=[];let y=+cm.slice(0,4),m=+cm.slice(5);for(let i=0;i<6;i++){r.unshift(y+'-'+pad(m));if(--m<1){m=12;y--}}return r};
const chM=()=>lastN();
const ms=()=>allMonths().filter(m=>(!F.ys.length||F.ys.includes(+m.slice(0,4)))&&(!F.mo.length||F.mo.includes(+m.slice(5))));
const ofs=a=>ms().flatMap(m=>occM(a,m));
const tot=(a,m,f)=>sum(occM(a,m),f);
const sv2=x=>x.v??x.q*x.u,srt=a=>a.sort((x,y)=>{const r=sk=='v'?sv2(x)-sv2(y):x.d.localeCompare(y.d);return sd=='asc'?r:-r});
let RZ=0;

const go=t=>{tab=t;F2=null;cs=null;DC=null;FO=null;CD=null;PS=null;DP=null;render();if(t=='inv')refQ(false)};
const tg=(k,v)=>{F[k]=F[k].includes(v)?F[k].filter(x=>x!=v):[...F[k],v];render()};
const del=(k,id)=>{S[k]=S[k].filter(x=>x.id!=id);save();render()};
const pay=(id,m)=>{const k=id+'|'+m;S.paid[k]=!S.paid[k];save();render()};
const setPct=v=>{S.pct=Math.max(0,Math.min(100,+v||0));save();render()};
let sk='d';const toggleSort=k=>{if(sk==k)sd=sd=='asc'?'desc':'asc';else{sk=k;sd='desc'}render()};
function openF(k,id,d,cal){F2={k,x:id?S[k].find(i=>i.id==id):null,d,cal};render();setTimeout(()=>{const p=$('#fp');p&&p.scrollIntoView({block:'nearest'})},0)}
const dayF=d=>openF('exp',null,d,1);
const setK=k=>{F2.k=k;render()};
function sub(e){e.preventDefault();const k=F2.k,o=Object.fromEntries(new FormData(e.target)),old=F2.x;delete o.t;o.id=old?old.id:uid();const di=isoOf(o.d);if(!di){$('#ferr').textContent='Data inválida. Use dd/mm/aaaa.';return}o.d=di;if(o.vc!==undefined){if(o.vc){const dv=isoOf(o.vc);if(!dv){$('#ferr').textContent='Vencimento inválido. Use dd/mm/aaaa.';return}o.vc=dv}else delete o.vc}
 if(k!='inv'){o.v=+o.v;o.fx=o.fx?1:0}else{o.tk=o.tk||'';if(!SV(o.tp))o.tk=o.tk.toUpperCase();if(!o.c1)delete o.c1;if(!o.c2)delete o.c2;if(SV(o.tp)){o.q=1;o.u=+o.vl;delete o.vl}else if(o.tp=='Exterior'||o.tp=='Cripto'){o.q=+o.q;o.up=+o.up;o.cb=+o.cb;o.u=o.up*o.cb}else{o.q=+o.q;o.u=+o.u}if(F2.mz||(old&&old.mz))o.mz=1}
 if(k=='exp'&&(old?old.cal:F2.cal))o.cal=1;
 const i=S[k].findIndex(x=>x.id==o.id);i<0?S[k].push(o):S[k][i]=o;F2=null;if(tab=='cal'&&CDr){CD=ym(o.d)==calM?o.d:null;CDr=null}if(PSr){PS={tp:o.tp,tk:o.tk};PSr=null}save();render()}
function fm(){if(!F2)return '';const k=F2.k,x=F2.x||{},E=!!F2.x,d=F2.d||x.d||today;
 const ty='',tsel=tab=='cal'&&!E?`<div style="display:flex;justify-content:flex-start;margin-bottom:8px">${csel('','ktipo',['Entrada','Despesa','Investimento'],{inc:'Entrada',exp:'Despesa',inv:'Investimento'}[k],v=>setK({Entrada:'inc',Despesa:'exp',Investimento:'inv'}[v]),1)}</div>`:'';
 const fx=k!='inv'?`<label class="r"><input type="checkbox" name="fx" ${x.fx?'checked':''}> ${k=='inc'?'Entrada fixa':'Despesa fixa'}: repete todo mês neste dia</label>`:'';
 const mzn=k=='inv'&&(F2.mz||x.mz)?'<p class="mu" style="flex:1 1 100%;margin:0">Marco zero: informe a quantidade e o preço médio da posição que você já tem. Não conta como aporte do período.</p>':'';
 const f=k=='inv'?invF(x,d)
 :`<label>Descrição<input name="desc" value="${esc(x.desc||'')}" required></label>${dIn(x.fx?'Data de início':'Data','d',d,1)}<label>Valor (R$)<input type="number" name="v" step="0.01" min="0" value="${x.v??''}" required></label>`+(k=='exp'?`${csel('Categoria','cat',CATS,x.cat||CATS[0])}${csel('Pagamento','pay',PAY,x.pay||PAY[0])}`:'')+fx;
 return `<section class="cd1" id="fp">${tsel}${E?`<h2>Editar ${k=='inc'?'entrada':k=='exp'?'despesa':'investimento'}</h2>`:''}<form onsubmit="sub(event)" oninput="calcT(this)">${ty}${mzn}${f}<p id="ferr" class="neg" style="flex:1 1 100%;margin:0"></p><div class="ft"><span><button class="pr">Salvar</button> <button type="button" class="chip" onclick="F2=null;CD=CDr;CDr=null;PS=PSr;PSr=null;render()">Cancelar</button></span>${k=='inv'?`<span class="mu">Total: <b id="tv">${brl((x.q||0)*(x.u||0))}</b></span>`:''}</div></form></section>`}
const card=(t,h)=>`<section class="cd1"><h2>${t}</h2>${h}</section>`,empty=t=>`<p class="mu">${t}</p>`;
const barra=(l,t,b,k)=>`<div class="tp"><div class="k1"><span>${l}</span><b>${brl(t)}</b></div><button class="pr" onclick="openF('${k}')">${b}</button></div>`;
